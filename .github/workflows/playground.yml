name: Playground

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - grammar.js
      - src/**
      - queries/highlights.scm
      - examples/foo.html.tera
      - playground/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/playground.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "latest"

      - name: Install dependencies
        run: pnpm install

      - name: Build Wasm parser
        run: pnpm exec tree-sitter build --wasm

      - name: Export playground
        run: pnpm exec tree-sitter playground --export _site

      - name: Customize playground
        run: node playground/customize.js _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
